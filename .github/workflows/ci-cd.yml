name: Claude Code LXC Application CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  APP_NAME: claude-code-app
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # === Phase 1: Code Quality and Testing ===
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup development tools
      run: |
        # Install mise for runtime management
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Install aqua for CLI tools
        curl -sSfL https://raw.githubusercontent.com/aquaproj/aqua-installer/v3.0.1/aqua-installer | bash
        echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH
        
    - name: Install project dependencies
      run: |
        mise install
        aqua install
        mise run setup
        
    - name: Run linting
      run: mise run lint
      
    - name: Run security scans
      run: |
        # Scan for vulnerabilities
        trivy fs . --exit-code 1 --severity HIGH,CRITICAL
        
        # Check for secrets
        if [ -f .gitleaks.toml ]; then
          gitleaks detect --source . --config .gitleaks.toml
        fi

  # === Phase 2: Build and Test ===
  build-and-test:
    name: Build and Test Applications
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        test-type: [unit, integration]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup development environment
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        mise install
        mise run setup
        
    - name: Build applications
      run: mise run build
      
    - name: Run ${{ matrix.test-type }} tests
      run: |
        case "${{ matrix.test-type }}" in
          unit)
            mise run test
            ;;
          integration)
            # Start test infrastructure
            docker-compose -f docker-compose.test.yml up -d
            
            # Wait for services
            sleep 30
            
            # Run integration tests
            mise run test:integration
            
            # Cleanup
            docker-compose -f docker-compose.test.yml down
            ;;
        esac
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test-type }}
        path: |
          test-results/
          coverage/

  # === Phase 3: Container Build ===
  container-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: build-and-test
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run container security scan
      run: |
        trivy image --exit-code 1 --severity HIGH,CRITICAL \
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # === Phase 4: Infrastructure Validation ===
  infrastructure-validation:
    name: Validate Infrastructure Code
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6
        
    - name: Terraform Init
      run: |
        cd terraform
        terraform init
        
    - name: Terraform Validate
      run: |
        cd terraform
        terraform validate
        
    - name: Terraform Plan
      run: |
        cd terraform
        terraform plan -var="environment=ci" -var="app_version=${{ github.sha }}"
        
    - name: Run infrastructure security scan
      run: |
        # Scan Terraform files
        checkov -d terraform/ --exit-code 1
        
        # Scan for security issues
        tfsec terraform/ --concise-output

  # === Phase 5: Deployment ===
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [container-build, infrastructure-validation]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup deployment tools
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        curl -sSfL https://raw.githubusercontent.com/aquaproj/aqua-installer/v3.0.1/aqua-installer | bash
        echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH
        
        aqua install
        
    - name: Deploy infrastructure
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve \
          -var="environment=development" \
          -var="app_version=${{ github.sha }}" \
          -var="replicas=1"
          
    - name: Verify deployment
      run: |
        # Wait for deployment
        sleep 60
        
        # Health check
        curl -f http://localhost:8080/health
        
        # Run smoke tests
        mise run test:smoke
        
    - name: Notify deployment status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Development deployment ${{ job.status }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [container-build, infrastructure-validation]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup deployment tools
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        curl -sSfL https://raw.githubusercontent.com/aquaproj/aqua-installer/v3.0.1/aqua-installer | bash
        echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH
        
        aqua install
        
    - name: Deploy infrastructure
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve \
          -var="environment=staging" \
          -var="app_version=${{ github.sha }}" \
          -var="replicas=2"
          
    - name: Run staging tests
      run: |
        # Wait for deployment
        sleep 90
        
        # Health check
        curl -f http://localhost:8080/health
        
        # Run comprehensive tests
        mise run test:staging
        
    - name: Performance testing
      run: |
        # Load testing with k6
        k6 run tests/load-test.js

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Manual approval checkpoint
      uses: hmarr/auto-approve-action@v3
      if: github.actor == 'dependabot[bot]'
      
    - name: Setup deployment tools
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        curl -sSfL https://raw.githubusercontent.com/aquaproj/aqua-installer/v3.0.1/aqua-installer | bash
        echo "$HOME/.local/share/aquaproj-aqua/bin" >> $GITHUB_PATH
        
        aqua install
        
    - name: Deploy infrastructure (Blue-Green)
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve \
          -var="environment=production" \
          -var="app_version=${{ github.sha }}" \
          -var="replicas=3" \
          -var="enable_ssl=true"
          
    - name: Verify production deployment
      run: |
        # Extended health checks
        sleep 120
        
        # Health check
        curl -f https://your-domain.com/health
        
        # Critical path testing
        mise run test:production
        
    - name: Notify production deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }} - Version ${{ github.sha }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # === Phase 6: Monitoring and Cleanup ===
  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-development, deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Update monitoring dashboards
      run: |
        # Update Grafana dashboards
        # Update alerting rules
        echo "Monitoring setup completed"
        
    - name: Create deployment record
      run: |
        # Record deployment in monitoring system
        # Update change management system
        echo "Deployment recorded"
        
    - name: Cleanup old images
      run: |
        # Clean up old container images
        # Maintain only last 10 versions
        echo "Cleanup completed"