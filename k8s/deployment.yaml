# Claude Code Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code-app
  namespace: claude-code-dev
  labels:
    app: claude-code-app
    tier: application
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
      
  selector:
    matchLabels:
      app: claude-code-app
      tier: application
      
  template:
    metadata:
      labels:
        app: claude-code-app
        tier: application
        version: v1
    spec:
      containers:
      - name: claude-code-app
        image: claude-code-app:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
          
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: claude-code-app-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: claude-code-app-config
              key: PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: claude-code-app-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_URL
              
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
            
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: temp-storage
          mountPath: /tmp
          
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: temp-storage
        emptyDir: {}
        
      restartPolicy: Always
      
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: claude-code-dev
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
    
  selector:
    matchLabels:
      app: postgres
      tier: database
      
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        
        ports:
        - containerPort: 5432
          name: postgres
          
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: claude-code-app-config
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: claude-code-app-config
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: POSTGRES_PASSWORD
              
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - claude_code
            - -d
            - claude_dev
          initialDelaySeconds: 30
          periodSeconds: 10
          
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - claude_code
            - -d
            - claude_dev
          initialDelaySeconds: 5
          periodSeconds: 5
          
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
          
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: claude-code-dev
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: redis
      tier: cache
      
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        
        ports:
        - containerPort: 6379
          name: redis
          
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "256mb"
        - --maxmemory-policy
        - "allkeys-lru"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
            
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          
        volumeMounts:
        - name: redis-storage
          mountPath: /data
          
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
          
---
# Nginx Load Balancer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: claude-code-dev
  labels:
    app: nginx
    tier: proxy
spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: nginx
      tier: proxy
      
  template:
    metadata:
      labels:
        app: nginx
        tier: proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        
        ports:
        - containerPort: 80
          name: http
          
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
            
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config