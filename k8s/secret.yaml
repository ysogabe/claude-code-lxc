# Secrets for Claude Code application
# Note: In production, secrets should be managed via external secret management
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: claude-code-dev
  labels:
    app: claude-code-app
    tier: database
type: Opaque
data:
  # Base64 encoded values (for development only)
  # Production should use proper secret management (e.g., HashiCorp Vault, AWS Secrets Manager)
  POSTGRES_PASSWORD: ZGV2X3Bhc3N3b3Jk  # dev_password
  DATABASE_URL: cG9zdGdyZXNxbDovL2NsYXVkZV9jb2RlOmRldl9wYXNzd29yZEBwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvY2xhdWRlX2Rlhg==  # postgresql://claude_code:dev_password@postgres-service:5432/claude_dev
  
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: claude-code-dev
  labels:
    app: claude-code-app
    tier: cache
type: Opaque
data:
  REDIS_URL: cmVkaXM6Ly9yZWRpcy1zZXJ2aWNlOjYzNzk=  # redis://redis-service:6379
  
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: claude-code-dev
  labels:
    app: claude-code-app
    tier: application
type: Opaque
data:
  JWT_SECRET: Y2xhdWRlLWNvZGUtand0LXNlY3JldA==  # claude-code-jwt-secret
  SESSION_SECRET: Y2xhdWRlLWNvZGUtc2Vzc2lvbi1zZWNyZXQ=  # claude-code-session-secret
  API_KEY: Y2xhdWRlLWNvZGUtYXBpLWtleQ==  # claude-code-api-key
  
---
# For external API integrations (example)
apiVersion: v1
kind: Secret
metadata:
  name: external-api-secrets
  namespace: claude-code-dev
  labels:
    app: claude-code-app
    tier: integration
type: Opaque
data:
  GITHUB_TOKEN: ""  # Add your GitHub token (base64 encoded)
  SLACK_WEBHOOK: ""  # Add your Slack webhook (base64 encoded)
  OPENAI_API_KEY: ""  # Add your OpenAI API key (base64 encoded)